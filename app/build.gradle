 buildTypes { preview { initWith debug; applicationIdSuffix '.preview'; versionNameSuffix '-preview'; matchingFallbacks = ['debug']; manifestPlaceholders = [appLabel: 'Мои чеки — макет'] } }
 defaultConfig { manifestPlaceholders = [appLabel: 'Мои чеки']; applicationId 'ru.klimov.receipts'; minSdk 26; targetSdk 34; versionCode 3; versionName '0.3' }
}
dependencies { implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
